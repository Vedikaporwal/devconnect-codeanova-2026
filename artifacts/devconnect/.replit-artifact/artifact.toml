kind = "web"
previewPath = "/"
title = "DevConnect"
description = "A premium developer networking and portfolio platform landing page, with a Day 1 foundation for its future API and database."
version = "1.0.0"
id = "artifacts/devconnect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20644

[services.development]
run = "pnpm --filter @workspace/devconnect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devconnect", "run", "build" ]
serve = "static"
publicDir = "artifacts/devconnect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20644"
BASE_PATH = "/"
